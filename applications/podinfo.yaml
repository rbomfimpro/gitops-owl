apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
spec:
  project: workloads
  source:
    repoURL: https://github.com/rbomfimpro/gitops-owl
    targetRevision: main
    path: manifests/podinfo
    kustomize:
      images:
        - ghcr.io/stefanprodan/podinfo:6.10.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
  destination:
    server: https://kubernetes.default.svc
    namespace: apps