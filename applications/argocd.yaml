apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/argoproj/argo-helm/argo-cd
      targetVersion: 9.5.17
      path: .
      helm:
        releaseName: argocd
      valuesFiles:
      - $values/manifests/argocd/values.yaml
    - repoURL: https://github.com/rbomfimpro/gitops-owl-v2
      targetVersion: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd