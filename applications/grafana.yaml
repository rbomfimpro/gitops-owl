apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: https://grafana-community.github.io/helm-charts/
    chart: grafana
    targetRevision: 12.4.1
    helm:
      releaseName: grafana
      valueFiles: 
      - $values/manifests/grafana/values.yaml
  - repoURL: https://github.com/rbomfimpro/gitops-owl-v2
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring