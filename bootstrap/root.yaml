apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/rbomfimpro/gitops-owl-v2
      targetRevision: main
      path: applications
      directory:
        recurse: true
    - repoURL: https://github.com/rbomfimpro/gitops-owl-v2
      targetRevision: main
      path: applicationsets
    - repoURL: https://github.com/rbomfimpro/gitops-owl-v2
      targetRevision: main
      path: projects
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
