apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helm
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/rbomfimpro/gitops-owl-v2
        revision: main
        files:
          - path: applicationsets/registry/helm.yaml
    - list:
        elementsYaml: "{{ .list | toJson }}"
  template:
    metadata:
      name: '{{ .releaseName }}'
      namespace: argocd
    spec:
      project: '{{ .project }}'
      sources:
        - repoURL: '{{ .chartURL }}'
          chart: '{{ .chartName | default "" }}'
          targetRevision: '{{ .chartVersion }}'
          path: .
          helm:
            releaseName: '{{ .releaseName }}'
            valueFiles:
              - $values/manifests/{{ .releaseName }}/values.yaml
        - repoURL: '{{ .repoURL | default "https://github.com/rbomfimpro/gitops-owl-v2" }}'
          targetRevision: '{{ .targetRevision | default "main" }}'
          ref: values
          path: manifests/{{ .releaseName }}
          directory:
            exclude: values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
  templatePatch: |
    spec:
      syncPolicy:
        automated:
          prune: {{ .prune | default true }}
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - 'CreateNamespace={{ .createNamespace | default true }}'
          - ServerSideApply=true
          - 'PruneLast={{ .pruneLast | default true }}'