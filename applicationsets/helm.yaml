apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helm
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/rbomfimpro/gitops-owl-v2
              revision: main
              files:
                - path: applicationsets/registry/helm.yaml
          - list:
              elementsYaml: "{{ .applications | toJson }}"
  template:
    metadata:
      name: '{{ .name }}'
      namespace: argocd
    spec:
      project: '{{ .project }}'
      sources:
        - repoURL: '{{ .chartURL }}'
          chart: '{{ .chartName }}'
          targetRevision: '{{ .chartVersion }}'
          helm:
            releaseName: '{{ .releaseName | default .name }}'
            valueFiles:
              - $values/manifests/{{ .name }}/values.yaml
        - repoURL: '{{ .repoURL | default "https://github.com/rbomfimpro/gitops-owl-v2" }}'
          targetRevision: '{{ .targetRevision | default "main" }}'
          ref: values
          path: manifests/{{ .name }}
          directory:
            exclude: values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
  templatePatch: |
    spec:
      syncPolicy:
        automated:
          prune: {{ .prune | default true }}
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - 'CreateNamespace={{ .createNamespace | default true }}'
          - ServerSideApply=true
          - 'PruneLast={{ .pruneLast | default true }}'
      {{- if .ignoreDifferences }}
      ignoreDifferences: {{ .ignoreDifferences | toJson }}
      {{- end }}