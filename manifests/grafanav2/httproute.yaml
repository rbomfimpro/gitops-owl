apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafanav2
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "grafanav2.owl.localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          port: 80
