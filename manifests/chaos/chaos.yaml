apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos
  labels:
    app.kubernetes.io/name: chaos
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: chaos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chaos
    spec:
      containers:
      - name: chaos
        image: fabricioveronez/simulador-do-caos
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 150m
            memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chaos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chaos
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chaos
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "chaos.owl.localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: chaos
          port: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chaos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chaos
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 60