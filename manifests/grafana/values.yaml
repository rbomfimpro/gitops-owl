extraObjects:
- apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  metadata:
    name: prometheus
  spec:
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
    hostnames:
      - "prometheus.owl.localhost"
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - name: prometheus-server
            port: 80