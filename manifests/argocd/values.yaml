global:
  domain: argocd.owl.localhost

configs:
  params:
    server.insecure: "true"
    controller.diff.server.side: "true"
  cm:
    accounts.rbomfim: login
    accounts.gmendes: login
    accounts.rgaldino: login
    accounts.jenkins: apiKey
  rbac:
    policy.default: role:viewer
    policy.csv: |
      # =========================================================================
      # GLOBAL CUSTOM ROLES
      # Syntax: p, <role>, <resource>, <action>, <object>, <effect>
      # Object for applications/logs = <project>/<app>  (e.g. workloads/api)
      # =========================================================================
   
      # =========================================================================
      # BUILT-IN ROLES
      # role:admin, role:readonly
      # =========================================================================

      # ---------- viewer: read-only, minimal (global baseline via policy.default) ----------
      # ALLOW
      # Applications
      p, role:viewer, applications, get, */*,        allow
      p, role:viewer, logs,         get, */*,        allow
      # Settings
      p, role:viewer, clusters,     get, *,          allow
      p, role:viewer, projects,     get, *,          allow
      # DENY
      # Applications
      p, role:viewer, applications, get, platform/*, deny
      p, role:viewer, logs,         get, platform/*, deny
      p, role:viewer, applications, get, default/*,  deny
      p, role:viewer, logs,         get, default/*,  deny
  
      # ---------- operator: operates apps across all projects (does NOT reconfigure) ----------
      # ALLOW
      # Applications
      p, role:operator, applications,    get,      */*, allow
      p, role:operator, applications,    update,   */*, allow
      p, role:operator, applications,    sync,     */*, allow
      p, role:operator, applications,    override, */*, allow
      p, role:operator, applicationsets, get,      */*, allow
      p, role:operator, applicationsets, update,   */*, allow
      p, role:operator, logs,            get,      */*, allow
      p, role:operator, extensions,      invoke,   *,   allow
      # Settings
      p, role:operator, clusters,        get,      *,   allow
      p, role:operator, projects,        get,      *,   allow
      p, role:operator, repositories,    get,      *,   allow
      p, role:operator, certificates,    get,      *,   allow
      p, role:operator, gpgkeys,         get,      *,   allow
      # DENY
      # Applications
      p, role:operator, exec,            create,   */*, deny
  
      # ---------- poweruser: full CRUD on resources, NO shell and NO account management ----------
      # ALLOW
      # Applications
      p, role:poweruser, applications,    *,      */*, allow
      p, role:poweruser, applicationsets, *,      */*, allow
      p, role:poweruser, logs,            get,    */*, allow
      p, role:poweruser, extensions,      invoke, *,   allow
      # Settings
      p, role:poweruser, clusters,        *,      *,   allow
      p, role:poweruser, projects,        *,      *,   allow
      p, role:poweruser, repositories,    *,      *,   allow
      p, role:poweruser, certificates,    *,      *,   allow
      p, role:poweruser, gpgkeys,         *,      *,   allow
      # DENY
      # Applications
      p, role:poweruser, exec,            create, */*, deny
  
      # =========================================================================
      # SSO/OIDC GROUP -> GLOBAL ROLE MAPPING
      # (Per-project "developer" groups are bound inside each AppProject manifest.)
      # =========================================================================
      # SAMPLES
      # g, your-org:platform-engineers, role:poweruser
      # g, your-org:sre,                role:operator
      # g, your-org:staff,              role:viewer
server:
  # HA mode with autoscaling
  autoscaling:
    enabled: true
    minReplicas: 2

  # Enable Argo Rollouts Extension
  extensions:
    enabled: true
    extensionList:
      - name: rollout-extension
        env:
          - name: EXTENSION_URL
            value: https://github.com/argoproj-labs/rollout-extension/releases/download/v0.3.7/extension.tar

  # Gateway API HTTPRoute
  httproute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
        sectionName: websecure

# HA mode with autoscaling
redis-ha:
  enabled: true

controller:
  replicas: 1

repoServer:
  autoscaling:
    enabled: true
    minReplicas: 2

applicationSet:
  replicas: 2