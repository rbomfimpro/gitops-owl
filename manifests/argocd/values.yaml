global:
  domain: argocd.owl.localhost

configs:
  params:
    server.insecure: "true"
    controller.diff.server.side: "true"
  cm:
    accounts.rbomfim: login
    accounts.gmendes: login
    accounts.rgaldino: login
    accounts.jenkins: apiKey
  rbac:
    policy.default: role:viewer
    policy.csv: |
      # =========================================================================
      # GLOBAL CUSTOM ROLES
      # Syntax: p, <role>, <resource>, <action>, <object>, <effect>
      # Object for applications/logs = <project>/<app>  (e.g. workloads/api)
      # =========================================================================
   
      # =========================================================================
      # BUILT-IN ROLES
      # role:admin, role:readonly
      # =========================================================================

      # ---------- viewer: read-only, minimal (global baseline via policy.default) ----------
      # ALLOW
      # Applications
      p, role:viewer, applications, get, */*,        allow
      p, role:viewer, logs,         get, */*,        allow
      # Settings
      p, role:viewer, clusters,     get, *,          allow
      p, role:viewer, projects,     get, *,          allow
      # DENY
      # Applications
      p, role:viewer, applications, get, platform/*, deny
      p, role:viewer, logs,         get, platform/*, deny
      p, role:viewer, applications, get, default/*,  deny
      p, role:viewer, logs,         get, default/*,  deny
  
      # ---------- operator: operates apps across all projects (does NOT reconfigure) ----------
      # ALLOW
      # Applications
      p, role:operator, applications,    get,      */*, allow
      p, role:operator, applications,    update,   */*, allow
      p, role:operator, applications,    sync,     */*, allow
      p, role:operator, applications,    override, */*, allow
      p, role:operator, applicationsets, get,      */*, allow
      p, role:operator, applicationsets, update,   */*, allow
      p, role:operator, logs,            get,      */*, allow
      p, role:operator, extensions,      invoke,   *,   allow
      # Settings
      p, role:operator, clusters,        get,      *,   allow
      p, role:operator, projects,        get,      *,   allow
      p, role:operator, repositories,    get,      *,   allow
      p, role:operator, certificates,    get,      *,   allow
      p, role:operator, gpgkeys,         get,      *,   allow
      # DENY
      # Applications
      p, role:operator, exec,            create,   */*, deny
  
      # ---------- poweruser: full CRUD on resources, NO shell and NO account management ----------
      # ALLOW
      # Applications
      p, role:poweruser, applications,    *,      */*, allow
      p, role:poweruser, applicationsets, *,      */*, allow
      p, role:poweruser, logs,            get,    */*, allow
      p, role:poweruser, extensions,      invoke, *,   allow
      # Settings
      p, role:poweruser, clusters,        *,      *,   allow
      p, role:poweruser, projects,        *,      *,   allow
      p, role:poweruser, repositories,    *,      *,   allow
      p, role:poweruser, certificates,    *,      *,   allow
      p, role:poweruser, gpgkeys,         *,      *,   allow
      # DENY
      # Applications
      p, role:poweruser, exec,            create, */*, deny
  
      # =========================================================================
      # SSO/OIDC GROUP -> GLOBAL ROLE MAPPING
      # (Per-project "developer" groups are bound inside each AppProject manifest.)
      # =========================================================================
      # SAMPLES
      # g, your-org:platform-engineers, role:poweruser
      # g, your-org:sre,                role:operator
      # g, your-org:staff,              role:viewer

  # =========================================================================
  # CUSTOM UI STYLES — tema dark coeso para a UI core do Argo CD
  # (escopado em .theme-dark, nao afeta o modo claro).
  # O tema do Argo CD e SCSS compile-time (sem vars de runtime), entao isto
  # sobrescreve as superficies principais com uma paleta unica. Selectors
  # reais: .white-box .sidebar .flex-top-bar .application-status-panel
  # .argo-button .tabs .argo-dropdown .sliding-panel .argo-table-list__row.
  # Ajuste tudo na paleta --owl-* abaixo (um lugar so).
  # =========================================================================
  styles: |-
    .theme-dark {
      --owl-bg:       #14161b;  /* fundo base da app (era #100f0f, muito duro) */
      --owl-surface:  #1b1e24;  /* paineis / white-box */
      --owl-surface2: #22262e;  /* elevado: dropdowns, inputs, nos */
      --owl-surface3: #2a2f38;  /* hover / ativo */
      --owl-border:   #2e333d;  /* bordas e divisores unificados */
      --owl-text:     #e3e6ea;  /* texto primario */
      --owl-text-dim: #969ca7;  /* texto secundario */
      --owl-accent:   #1fbdd0;  /* teal de marca do Argo */
    }

    /* ---- Fundo geral ---- */
    .theme-dark .layout,
    .theme-dark .page,
    .theme-dark .page__content,
    .theme-dark .application-details {
      background-color: var(--owl-bg) !important;
    }

    /* ---- Paineis (white-box e a classe de painel mais usada) ---- */
    .theme-dark .white-box,
    .theme-dark .argo-container,
    .theme-dark .application-status-panel,
    .theme-dark .editable-panel,
    .theme-dark .filters-group__panel,
    .theme-dark .resource-details__header {
      background-color: var(--owl-surface) !important;
      border-color: var(--owl-border) !important;
      color: var(--owl-text);
    }

    /* ---- Sidebar ---- */
    .theme-dark .sidebar {
      background-color: var(--owl-surface) !important;
      border-right: 1px solid var(--owl-border);
    }
    .theme-dark .sidebar__nav-item:hover {
      background-color: var(--owl-surface3) !important;
    }

    /* ---- Top bar ---- */
    .theme-dark .flex-top-bar,
    .theme-dark .top-bar,
    .theme-dark .top-bar__title {
      background-color: var(--owl-surface) !important;
      border-bottom: 1px solid var(--owl-border);
    }

    /* ---- Nos do grafo de recursos ----
       NAO sobrescrever background: o Argo colore os nos POR TIPO
       (--pod = ciano, --load-balancer = teal, etc.) e isso e o "destaque".
       NAO sobrescrever a borda: &.active usa teal para marcar o selecionado.
       Aqui so reforco o destaque de selecao com o accent de marca. */
    .theme-dark .application-resource-tree__node.active {
      border-color: var(--owl-accent) !important;
      box-shadow: 0 0 0 1px var(--owl-accent) !important;
    }

    /* ---- Tabelas ---- */
    .theme-dark .argo-table-list__row {
      background-color: var(--owl-surface) !important;
      border-color: var(--owl-border) !important;
    }
    .theme-dark .argo-table-list__row:hover {
      background-color: var(--owl-surface3) !important;
    }

    /* ---- Dropdowns / paineis deslizantes / inputs ---- */
    .theme-dark .argo-dropdown__content,
    .theme-dark .sliding-panel,
    .theme-dark .sliding-panel__body {
      background-color: var(--owl-surface2) !important;
      color: var(--owl-text);
    }
    .theme-dark .argo-field,
    .theme-dark input[type='text'],
    .theme-dark select,
    .theme-dark textarea {
      background-color: var(--owl-surface2) !important;
      border-color: var(--owl-border) !important;
      color: var(--owl-text);
    }

    /* ---- Botoes secundarios (outline). Primarios/coloridos ficam intactos ---- */
    .theme-dark .argo-button--base-o {
      background-color: var(--owl-surface2) !important;
      border-color: var(--owl-border) !important;
      color: var(--owl-text) !important;
    }
    .theme-dark .argo-button--base-o:hover {
      background-color: var(--owl-surface3) !important;
    }

    /* ---- Abas: indicador ativo no accent de marca ---- */
    .theme-dark .tabs__nav-item.active {
      color: var(--owl-accent) !important;
      border-bottom-color: var(--owl-accent) !important;
    }

    /* ---- Logs no dark: remove fundo branco atras do texto da linha ---- */
    .theme-dark .noscroll code,
    .theme-dark .noscroll code span {
      background-color: transparent !important;
    }
server:
  # HA mode with autoscaling
  autoscaling:
    enabled: true
    minReplicas: 2

  # Enable Argo Rollouts Extension
  extensions:
    enabled: false
    extensionList:
      - name: rollout-extension
        env:
          - name: EXTENSION_URL
            value: https://github.com/argoproj-labs/rollout-extension/releases/download/v0.3.7/extension.tar

  # Gateway API HTTPRoute
  httproute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
        sectionName: websecure

# HA mode with autoscaling
redis-ha:
  enabled: true

controller:
  replicas: 1

repoServer:
  autoscaling:
    enabled: true
    minReplicas: 2

applicationSet:
  replicas: 2