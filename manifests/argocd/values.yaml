global:
  domain: argocd.owl.localhost

configs:
  params:
    server.insecure: "true"
    controller.diff.server.side: "true"
  cm:
    accounts.mercantil: login, apiKey
  rbac:
    policy.default: role.readonly
    policy.csv: |
      p, role:developer, applications, get, *, allow
      p, role:developer, applications, sync, *, allow
      g, mercantil, role:developer
      
server:
  # HA mode with autoscaling
  autoscaling:
    enabled: true
    minReplicas: 2

  # Gateway API HTTPRoute
  httproute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
        sectionName: websecure

# HA mode with autoscaling
redis-ha:
  enabled: true

controller:
  replicas: 1

repoServer:
  autoscaling:
    enabled: true
    minReplicas: 2

applicationSet:
  replicas: 2