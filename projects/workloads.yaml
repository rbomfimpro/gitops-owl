apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Company application workloads
  sourceRepos:
    - https://github.com/rbomfimpro/gitops-owl-v2.git
    - https://github.com/rbomfimpro/k8s-apps-v3.git
    - oci://ghcr.io/stefanprodan/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: apps
  # syncWindows:
  #   - kind: allow
  #     timeZone: "America/Sao_Paulo"
  #     schedule: '0 8 * * 1-5'
  #     duration: 14h
  #     manualSync: true
  #     applications:
  #       - '*'
  namespaceResourceWhitelist:
    # core
    - group: ""
      kind: "ConfigMap"
    - group: ""
      kind: "Secret"
    - group: ""
      kind: "Service"
    - group: ""
      kind: "ServiceAccount"
    - group: ""
      kind: "PersistentVolumeClaim"
    - group: ""
      kind: "Pod"
    # apps
    - group: "apps"
      kind: "DaemonSet"
    - group: "apps"
      kind: "Deployment"
    - group: "apps"
      kind: "ReplicaSet"
    - group: "apps"
      kind: "StatefulSet"
    # batch
    - group: "batch"
      kind: "Job"
    - group: "batch"
      kind: "CronJob"
    # scaling and distribution
    - group: "autoscaling"
      kind: "HorizontalPodAutoscaler"
    - group: "policy"
      kind: "PodDisruptionBudget"
    # networking
    - group: "gateway.networking.k8s.io"
      kind: "GRPCRoute"
    - group: "gateway.networking.k8s.io"
      kind: "HTTPRoute"
    - group: "networking.k8s.io"
      kind: "Ingress"

  roles:
    - name: developer
      description: Workloads Team - operate this project's applications (no delete, no exec)
      policies:
        - p, proj:workloads:developer, applications, get,    workloads/*, allow
        - p, proj:workloads:developer, applications, sync,   workloads/*, allow
        - p, proj:workloads:developer, applications, update, workloads/*, allow
      groups:
        # Local Users (No SSO)
        - rbomfim
        - gmendes
        - rgaldino
        # Service Accounts
        - jenkins
        # SSO Groups